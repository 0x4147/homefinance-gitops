apiVersion: v1
kind: ServiceAccount
metadata:
  name: mysql
  labels:
    {{- include "homefinance.labels" (dict "root" . "component" "mysql") | nindent 4 }}
automountServiceAccountToken: false
---
# Headless Service: gives the StatefulSet pod a stable DNS name (mysql)
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    {{- include "homefinance.labels" (dict "root" . "component" "mysql") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "homefinance.selectorLabels" (dict "root" . "component" "mysql") | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels:
    {{- include "homefinance.labels" (dict "root" . "component" "mysql") | nindent 4 }}
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      {{- include "homefinance.selectorLabels" (dict "root" . "component" "mysql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homefinance.labels" (dict "root" . "component" "mysql") | nindent 8 }}
    spec:
      serviceAccountName: mysql
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999   # the mysql group in the official image, so the volume is writable
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: {{ include "homefinance.image" (dict "name" "mysql" "registry" "" "image" .Values.mysql.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: mysql-root-password
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: mysql-password
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          startupProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mysql.storage }}
