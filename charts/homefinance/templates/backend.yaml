apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  labels:
    {{- include "homefinance.labels" (dict "root" . "component" "backend") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    {{- include "homefinance.labels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "homefinance.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homefinance.labels" (dict "root" . "component" "backend") | nindent 8 }}
      annotations:
        # Roll the pods when the config changes
        checksum/config: {{ include (print $.Template.BasePath "/backend-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.backend.runAsUser }}
        runAsGroup: {{ .Values.backend.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "homefinance.selectorLabels" (dict "root" . "component" "backend") | nindent 14 }}
      # Don't start the JVM until MySQL answers: Flyway runs at startup and the app exits if the
      # database is unreachable, which would otherwise show up as CrashLoopBackOff on every deploy.
      initContainers:
        - name: wait-for-mysql
          image: {{ include "homefinance.image" (dict "name" "mysql" "registry" "" "image" .Values.mysql.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - until mysqladmin ping -h mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent; do echo "waiting for mysql"; sleep 3; done
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: mysql-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: backend
          image: {{ include "homefinance.image" (dict "name" "backend" "registry" .Values.image.registry "image" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: backend
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: mysql-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: mysql-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          # Spring Boot is slow to start (Flyway migrations on first boot): allow up to 3 minutes
          # before liveness takes over.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          # Readiness includes the database. The DB check can take ~30s to fail (Hikari connection
          # timeout), so the probe timeout is generous; a timeout counts as a failure either way.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness never touches the database: a DB outage must not restart healthy pods.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "homefinance.labels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  selector:
    {{- include "homefinance.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
{{- if .Values.backend.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  labels:
    {{- include "homefinance.labels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "homefinance.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
{{- end }}
