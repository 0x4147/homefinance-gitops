{{- if .Values.networkPolicy.enabled }}
# Ingress-only policies. Egress is deliberately left open for now: the backend may call external AI
# APIs (Athena) and needs DNS, so a default-deny egress policy is a later hardening step.
# Enforcement requires a CNI that supports NetworkPolicy (the minikube profile uses Calico).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "homefinance.labels" (dict "root" . "component" "network-policy") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-from-backend
  labels:
    {{- include "homefinance.labels" (dict "root" . "component" "network-policy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "homefinance.selectorLabels" (dict "root" . "component" "mysql") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "homefinance.selectorLabels" (dict "root" . "component" "backend") | nindent 14 }}
      ports:
        - port: 3306
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-from-frontend
  labels:
    {{- include "homefinance.labels" (dict "root" . "component" "network-policy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "homefinance.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "homefinance.selectorLabels" (dict "root" . "component" "frontend") | nindent 14 }}
      ports:
        - port: {{ .Values.backend.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-from-ingress
  labels:
    {{- include "homefinance.labels" (dict "root" . "component" "network-policy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "homefinance.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 80
{{- end }}
