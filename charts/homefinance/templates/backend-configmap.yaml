apiVersion: v1
kind: ConfigMap
metadata:
  name: backend
  labels:
    {{- include "homefinance.labels" (dict "root" . "component" "backend") | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.backend.springProfile | quote }}
  SPRING_DATASOURCE_URL: {{ printf "jdbc:mysql://mysql:3306/%s?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC" .Values.mysql.database | quote }}
  JAVA_TOOL_OPTIONS: {{ .Values.backend.javaToolOptions | quote }}
