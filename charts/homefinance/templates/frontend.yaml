apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  labels:
    {{- include "homefinance.labels" (dict "root" . "component" "frontend") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "homefinance.labels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "homefinance.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homefinance.labels" (dict "root" . "component" "frontend") | nindent 8 }}
    spec:
      serviceAccountName: frontend
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "homefinance.selectorLabels" (dict "root" . "component" "frontend") | nindent 14 }}
      containers:
        - name: frontend
          image: {{ include "homefinance.image" (dict "name" "frontend" "registry" .Values.image.registry "image" .Values.frontend.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          # The stock Nginx image starts as root and then drops to the nginx user for workers,
          # so it keeps the few capabilities that needs and nothing else.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "homefinance.labels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  selector:
    {{- include "homefinance.selectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
